  <text x="308" y="684.9" font-size="20.2" font-weight="700" fill="#fff">If RSI arrives, everything moves.</text>
  <text x="308" y="712.1" font-size="18.2" fill="#eee">It drags itself and the other two up and to</text>
  <text x="308" y="734.4" font-size="18.2" fill="#eee">the right, plus much else besides.</text>

