  <text x="294" y="1046.0" font-size="19.6" font-weight="700" fill="#111">RSI</text>
  <text x="294" y="1068.0" font-size="16.9" fill="#555">generality across AI research, depth within it · <tspan font-style="italic">nearest, and the driver of the other two</tspan></text>
