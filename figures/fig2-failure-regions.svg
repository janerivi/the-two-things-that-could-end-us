  <text x="264" y="1095.5" text-anchor="middle" font-size="17.6" font-weight="700" fill="#111">2</text>
  <text x="294" y="1090.0" font-size="19.6" font-weight="700" fill="#111">Industrial Singularity</text>
  <text x="294" y="1112.0" font-size="16.9" fill="#555">engineering, materials, control, logistics · <tspan font-style="italic">physics and simulators supply the reward signal</tspan></text>
  <circle cx="264" cy="1133.0" r="15" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="264" y="1139.5" text-anchor="middle" font-size="17.6" font-weight="700" fill="#111">3</text>
  <text x="294" y="1134.0" font-size="19.6" font-weight="700" fill="#111">Defeating human oversight</text>
  <text x="294" y="1156.0" font-size="16.9" fill="#555">the above, plus enough human behaviour · <tspan font-style="italic">the §3 argument</tspan></text>

  <text x="250" y="1196.0" font-size="17.6" font-style="italic" fill="#666">Dashed circles are uncertainty around a point estimate, not thresholds.</text>
  <text x="250" y="1220.0" font-size="17.6" font-style="italic" fill="#666">Placements are judgement; the field has no agreed way to measure this axis.</text>
