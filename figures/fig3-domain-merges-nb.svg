<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 592" width="1320" height="592" font-family="Helvetica">
  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="13" refX="0" refY="6.5" orient="auto"><path d="M0,0 L18,6.5 L0,13 Z" fill="#111"/></marker>
    <linearGradient id="bloc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#facc15"/><stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="1320" height="592" fill="#fff"/>
  <text x="660" y="48" text-anchor="middle" font-size="33" font-weight="700" fill="#111">Slik vokser generaliteten: nabofelt smelter sammen</text>
  <text x="660" y="78" text-anchor="middle" font-size="19.5" fill="#555">Sammensmeltinger er sprang, ikke lineær opphopning. Naboskap følger felles representasjonsstruktur.</text>

  <!-- stage 1: within-field (already happened) -->
  <rect x="50" y="112" width="272" height="142" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="186" y="146" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">HAR ALLEREDE SKJEDD</text>
  <text x="186" y="178" text-anchor="middle" font-size="18" fill="#166534">delfelt til hele felt</text>
  <text x="186" y="206" text-anchor="middle" font-size="17" fill="#166534">matematikk &#183; informatikk</text>
  <text x="186" y="236" text-anchor="middle" font-size="15.6" font-style="italic" fill="#15803d">evnen dekker nå bredden</text>

  <!-- stage 2: pairwise merges -->
  <g font-size="19" font-weight="700" fill="#111">
    <rect x="372" y="100" width="252" height="54" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.2"/>
    <text x="498" y="134" text-anchor="middle">matematikk + fysikk</text>
    <rect x="372" y="166" width="252" height="54" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.2"/>
    <text x="498" y="200" text-anchor="middle">matematikk + informatikk</text>
    <rect x="372" y="232" width="252" height="54" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.2"/>
    <text x="498" y="266" text-anchor="middle">fysikk + kjemi</text>
    <rect x="372" y="298" width="252" height="54" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.2"/>
    <text x="498" y="332" text-anchor="middle">kjemi + biologi</text>
  </g>
  <text x="498" y="378" text-anchor="middle" font-size="16.3" font-style="italic" fill="#666">enklest først &#8212; fysikk er matematikk beskrevet to ganger</text>

  <!-- stage 3: the bloc -->
  <rect x="684" y="114" width="300" height="240" rx="14" fill="url(#bloc)" stroke="#c2410c" stroke-width="2.5"/>
  <text x="834" y="152" text-anchor="middle" font-size="19.5" font-weight="700" fill="#431407">FORMELL VITENSKAP</text>
  <text x="834" y="190" text-anchor="middle" font-size="18" fill="#431407">matematikk + fysikk</text>
  <text x="834" y="215" text-anchor="middle" font-size="18" fill="#431407">+ kjemi + biologi</text>
  <text x="834" y="240" text-anchor="middle" font-size="18" font-weight="700" fill="#431407">+ informatikk</text>
  <text x="834" y="274" text-anchor="middle" font-size="17" font-style="italic" fill="#7c2d12">som bærer SIMULERING</text>
  <text x="834" y="310" text-anchor="middle" font-size="16.3" fill="#7c2d12">simulering er broen</text>
  <text x="834" y="332" text-anchor="middle" font-size="16.3" fill="#7c2d12">fra formalisme til atomer</text>

  <!-- stage 4: lethality 2 -->
  <rect x="1040" y="148" width="250" height="176" rx="14" fill="#1c1917" stroke="#000" stroke-width="2.5"/>
  <text x="1165" y="190" text-anchor="middle" font-size="19.5" font-weight="700" fill="#fff">INDUSTRIELL</text>
  <text x="1165" y="214" text-anchor="middle" font-size="19.5" font-weight="700" fill="#fff">INFRASTRUKTUR</text>
  <text x="1165" y="250" text-anchor="middle" font-size="17" font-weight="700" fill="#fecaca">Dødelighet 2</text>
  <text x="1165" y="282" text-anchor="middle" font-size="16.3" fill="#e7e5e4">autonom fra ende til ende</text>
  <text x="1165" y="304" text-anchor="middle" font-size="16.3" fill="#e7e5e4">uten menneske involvert</text>

  <!-- arrows -->
  <line x1="326" y1="180" x2="352" y2="160" stroke="#111" stroke-width="3" marker-end="url(#a)" stroke-linecap="butt"/>
  <line x1="628" y1="210" x2="662" y2="220" stroke="#111" stroke-width="3" marker-end="url(#a)" stroke-linecap="butt"/>
  <line x1="988" y1="234" x2="1018" y2="234" stroke="#111" stroke-width="3.5" marker-end="url(#a)" stroke-linecap="butt"/>

  <text x="660" y="440" text-anchor="middle" font-size="19.5" font-weight="700" fill="#111">Det observerbare signalet: et resultat som krever to nabofelt samtidig, og som ikke kunne kommet fra ett av dem alene.</text>
  <text x="660" y="470" text-anchor="middle" font-size="18" fill="#444">Et kjemiresultat som trengte fysikken. Et biologiresultat som trengte kjemien.</text>
  <text x="660" y="493" text-anchor="middle" font-size="18" fill="#444">Det er det tidligste tegnet på bevegelse langs generalitetsaksen.</text>

  <text x="660" y="537" text-anchor="middle" font-size="17.5" font-style="italic" fill="#666">Hvordan dette kan være feil: felt kan forbli adskilt fordi vurderingskriteriene er ulike selv der strukturen ikke er det,</text>
  <text x="660" y="560" text-anchor="middle" font-size="17.5" font-style="italic" fill="#666">og et system som er sterkt i to nabofelt, kan være to smale systemer og ikke én sammensmeltet evne.</text>
</svg>
