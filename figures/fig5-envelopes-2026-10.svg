<text x="140" y="1146" font-size="17" fill="#111"><tspan font-weight="700">H · John von Neumann</tspan><tspan fill="#444"> — the one human who arguably reached the corner</tspan></text>
<text x="110" y="1202" font-size="15" fill="#555">Points such as Navier–Stokes are the peaks of an envelope, not the whole system: a model can exceed top-human depth in narrow domains and</text>
<text x="110" y="1226" font-size="15" fill="#555">fall far below it as breadth grows. The danger is the envelope's shoulder reaching the boundary.</text>
