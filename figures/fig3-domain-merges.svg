<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 592" width="1320" height="592" font-family="Helvetica">
  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="13" refX="0" refY="6.5" orient="auto"><path d="M0,0 L18,6.5 L0,13 Z" fill="#111"/></marker>
    <linearGradient id="bloc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#facc15"/><stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="1320" height="592" fill="#fff"/>
  <text x="660" y="48" text-anchor="middle" font-size="33" font-weight="700" fill="#111">How generality advances: adjacent domains merge</text>
  <text x="660" y="78" text-anchor="middle" font-size="19.5" fill="#555">Merges are discrete jumps, not linear accumulation. Adjacency tracks shared representational structure.</text>

  <!-- stage 1: within-field (already happened) -->
  <rect x="50" y="112" width="272" height="142" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="186" y="146" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">ALREADY HAPPENED</text>
  <text x="186" y="178" text-anchor="middle" font-size="18" fill="#166534">sub-fields to whole field</text>
  <text x="186" y="206" text-anchor="middle" font-size="17" fill="#166534">maths &#183; computer science</text>
  <text x="186" y="236" text-anchor="middle" font-size="15.6" font-style="italic" fill="#15803d">capability now spans the breadth</text>

  <!-- stage 2: pairwise merges -->
  <g font-size="19" font-weight="700" fill="#111">
    <rect x="372" y="100" width="252" height="54" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.2"/>
    <text x="498" y="134" text-anchor="middle">maths + physics</text>
    <rect x="372" y="166" width="252" height="54" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.2"/>
    <text x="498" y="200" text-anchor="middle">maths + comp. sci.</text>
    <rect x="372" y="232" width="252" height="54" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.2"/>
    <text x="498" y="266" text-anchor="middle">physics + chemistry</text>
    <rect x="372" y="298" width="252" height="54" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.2"/>
    <text x="498" y="332" text-anchor="middle">chemistry + biology</text>
  </g>
  <text x="498" y="378" text-anchor="middle" font-size="16.3" font-style="italic" fill="#666">easiest first &#8212; physics is maths described twice</text>

  <!-- stage 3: the bloc -->
  <rect x="684" y="114" width="300" height="240" rx="14" fill="url(#bloc)" stroke="#c2410c" stroke-width="2.5"/>
  <text x="834" y="152" text-anchor="middle" font-size="19.5" font-weight="700" fill="#431407">THE FORMAL-SCIENCE BLOC</text>
  <text x="834" y="190" text-anchor="middle" font-size="18" fill="#431407">maths + physics</text>
  <text x="834" y="215" text-anchor="middle" font-size="18" fill="#431407">+ chemistry + biology</text>
  <text x="834" y="240" text-anchor="middle" font-size="18" font-weight="700" fill="#431407">+ computer science</text>
  <text x="834" y="274" text-anchor="middle" font-size="17" font-style="italic" fill="#7c2d12">which carries SIMULATION</text>
  <text x="834" y="310" text-anchor="middle" font-size="16.3" fill="#7c2d12">simulation is the bridge</text>
  <text x="834" y="332" text-anchor="middle" font-size="16.3" fill="#7c2d12">from formalism to atoms</text>

  <!-- stage 4: lethality 2 -->
  <rect x="1040" y="148" width="250" height="176" rx="14" fill="#1c1917" stroke="#000" stroke-width="2.5"/>
  <text x="1165" y="190" text-anchor="middle" font-size="19.5" font-weight="700" fill="#fff">INDUSTRIAL</text>
  <text x="1165" y="214" text-anchor="middle" font-size="19.5" font-weight="700" fill="#fff">INFRASTRUCTURE</text>
  <text x="1165" y="250" text-anchor="middle" font-size="17" font-weight="700" fill="#fecaca">Lethality 2</text>
  <text x="1165" y="282" text-anchor="middle" font-size="16.3" fill="#e7e5e4">autonomous end-to-end</text>
  <text x="1165" y="304" text-anchor="middle" font-size="16.3" fill="#e7e5e4">no human in the loop</text>

  <!-- arrows -->
  <line x1="326" y1="180" x2="352" y2="160" stroke="#111" stroke-width="3" marker-end="url(#a)" stroke-linecap="butt"/>
  <line x1="628" y1="210" x2="662" y2="220" stroke="#111" stroke-width="3" marker-end="url(#a)" stroke-linecap="butt"/>
  <line x1="988" y1="234" x2="1018" y2="234" stroke="#111" stroke-width="3.5" marker-end="url(#a)" stroke-linecap="butt"/>

  <text x="660" y="440" text-anchor="middle" font-size="19.5" font-weight="700" fill="#111">The observable signal: a result requiring two adjacent fields jointly, which could not have come from either alone.</text>
  <text x="660" y="470" text-anchor="middle" font-size="18" fill="#444">A chemistry result that needed the physics. A biology result that needed the chemistry.</text>
  <text x="660" y="493" text-anchor="middle" font-size="18" fill="#444">That is the earliest indicator of movement along the general axis.</text>

  <text x="660" y="537" text-anchor="middle" font-size="17.5" font-style="italic" fill="#666">How it could be wrong: fields may stay separate because their evaluation criteria differ even where their structure does not,</text>
  <text x="660" y="560" text-anchor="middle" font-size="17.5" font-style="italic" fill="#666">and a system strong in two adjacent fields may be two narrow systems rather than one merged capability.</text>
</svg>
