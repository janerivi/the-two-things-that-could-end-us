<text x="140" y="1180" font-size="17" fill="#111"><tspan font-weight="700">2026 · Agentisk sårbarhetsforskning</tspan><tspan fill="#444"> — fant feil millioner av fuzzing-kjøringer overså; etterprøvbar, enorm, med motstander</tspan></text>
