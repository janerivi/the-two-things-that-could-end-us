<text x="200" y="1000" font-size="15" fill="#555">Blå: matematikk. Hul: kollektiv (sverm). ✕: negativt resultat. Stiplet spor: samme metode som sprer seg til nye domener.</text>
<text x="200" y="1024" font-size="15" fill="#555">Fargen er avstand fra hjørnet, ikke en terskel: aksene er kontinuerlige, og feltet har ingen omforent måte å måle dybde på.</text>
