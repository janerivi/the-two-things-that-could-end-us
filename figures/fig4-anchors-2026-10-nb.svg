<text x="140" y="1010" font-size="17" fill="#111"><tspan font-weight="700">~1997 · EMI (David Cope)</tspan><tspan fill="#444"> — musikk i Bachs stil som lurte ekspertlyttere; arvet stil, ett domene</tspan></text>
