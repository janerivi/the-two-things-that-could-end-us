<text x="140" y="1282" font-size="17" fill="#111"><tspan font-weight="700">aug.–okt. 2026 · KI som forsker på KI</tspan><tspan fill="#444"> — 26 % av Anthropics FoU-oppgaver ledet av KI; forskningssmak over ekspertnivå (P-Zero)</tspan></text>
